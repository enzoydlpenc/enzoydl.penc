<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>중청루 메뉴 선택</title>
<style>
  :root{
    --navy:#0f1e46;
    --navy2:#152a5e;
    --gold:#d4af37;
    --gold-soft:#e7c96a;
    --bg:#f4f1ea;
    --card:#ffffff;
    --line:#e4ddc9;
    --text:#22252b;
    --muted:#6d7480;
    --red:#b23b3b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif;
    background:var(--bg);color:var(--text);
  }
  .wrap{max-width:960px;margin:0 auto;padding:0 16px 60px;}

  /* Header / branding */
  header{
    background:linear-gradient(145deg,var(--navy),var(--navy2));
    color:#fff;text-align:center;padding:26px 16px 22px;
    border-bottom:3px solid var(--gold);
  }
  .brand-sub{letter-spacing:6px;font-size:13px;color:var(--gold-soft);margin-bottom:6px;}
  .brand-cn{font-size:40px;font-weight:800;color:var(--gold);letter-spacing:10px;line-height:1;}
  .brand-en{font-size:11px;letter-spacing:4px;color:#c9d2e6;margin-top:8px;}
  .brand-kr{font-size:20px;font-weight:700;margin-top:8px;letter-spacing:8px;}
  .map-btn{
    display:inline-block;margin-top:16px;background:var(--gold);color:var(--navy);
    text-decoration:none;font-weight:700;font-size:13px;padding:9px 18px;border-radius:999px;
  }
  .map-btn:hover{background:var(--gold-soft);}

  h2{font-size:17px;margin:28px 0 12px;padding-left:10px;border-left:4px solid var(--gold);}

  /* Location */
  .loc{
    background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
    display:flex;flex-wrap:wrap;
  }
  .loc-map{flex:1 1 340px;min-height:180px;background:#e9edf3;position:relative;}
  .loc-map img{width:100%;height:100%;object-fit:cover;display:block;}
  .loc-map .fallback{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:6px;color:var(--muted);font-size:13px;text-align:center;padding:16px;
  }
  .loc-map .fallback .pin{font-size:40px;}
  .loc-info{flex:1 1 260px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;}
  .loc-info .addr{font-size:15px;font-weight:700;}
  .loc-info .near{font-size:13px;color:var(--muted);line-height:1.5;}
  .loc-info .map-btn2{
    align-self:flex-start;margin-top:6px;background:var(--navy);color:#fff;text-decoration:none;
    font-weight:700;font-size:13px;padding:9px 16px;border-radius:999px;
  }
  .loc-info .map-btn2:hover{background:var(--navy2);}

  /* Menu cards */
  .menus{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .menu-card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
    display:flex;flex-direction:column;
  }
  .thumb{aspect-ratio:1/1;background:#eef0f4;position:relative;display:flex;align-items:center;justify-content:center;}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb .fallback{font-size:52px;}
  .menu-body{padding:12px 12px 14px;display:flex;flex-direction:column;gap:6px;flex:1;}
  .menu-name{font-weight:700;font-size:14.5px;line-height:1.35;}
  .menu-desc{font-size:12px;color:var(--muted);line-height:1.4;flex:1;}
  .menu-price{font-size:16px;font-weight:800;color:var(--red);}

  /* People */
  .people{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;}
  .person{
    background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
  }
  .person-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .person-name{font-weight:800;font-size:16px;}
  .person-pick{font-size:12px;color:var(--muted);}
  .opts{display:flex;flex-direction:column;gap:8px;}
  .opt{
    display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;
    border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px;
    background:#fff;transition:.12s;
  }
  .opt:hover{border-color:var(--gold);}
  .opt.active{border-color:var(--navy);background:#eef2fb;font-weight:700;}
  .opt .op-price{color:var(--red);font-weight:700;font-size:12.5px;white-space:nowrap;}
  .opt.active .op-price{color:var(--navy);}
  .clear-one{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline;padding:4px 0 0;}

  /* Summary */
  .summary{
    background:var(--navy);color:#fff;border-radius:16px;padding:18px 20px;margin-top:22px;
  }
  .summary h3{margin:0 0 12px;color:var(--gold);font-size:16px;letter-spacing:2px;}
  .sum-rows{display:flex;flex-direction:column;gap:7px;font-size:13.5px;}
  .sum-row{display:flex;justify-content:space-between;border-bottom:1px dashed rgba(255,255,255,.18);padding-bottom:7px;}
  .sum-row span:first-child{color:#cdd6ea;}
  .sum-empty{color:#9aa6c4;font-size:13px;}
  .totbar{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding-top:12px;border-top:2px solid var(--gold);}
  .totbar .lbl{font-size:14px;color:#cdd6ea;}
  .totbar .val{font-size:26px;font-weight:800;color:var(--gold);}
  .count-note{font-size:12px;color:#9aa6c4;margin-top:4px;}
  .reset{
    display:block;margin:16px auto 0;background:transparent;border:1px solid var(--gold);color:var(--gold);
    padding:8px 20px;border-radius:999px;font-size:13px;cursor:pointer;
  }
  .reset:hover{background:var(--gold);color:var(--navy);}

  @media(max-width:640px){
    .menus{grid-template-columns:1fr;}
    .brand-cn{font-size:32px;}
  }
</style>
</head>
<body>
<header>
  <div class="brand-sub">호텔식 중화요리</div>
  <div class="brand-cn">中淸樓</div>
  <div class="brand-en">CHINESE RESTAURANT</div>
  <div class="brand-kr">중청루</div>
  <a class="map-btn" target="_blank"
     href="https://map.naver.com/p/entry/place/1040387266?lng=126.6322541&lat=37.3936041&placePath=%2Fmenu&entry=plt&searchType=place&c=15.00,0,0,0,dh">
     📍 네이버 지도에서 위치 보기

<div class="wrap">

      <div class="near">센트럴파크역(인천1호선) 바로 옆<br>아트센터 인천 · 송도 센트럴파크 인근</div>
      <a class="map-btn2" target="_blank"

         네이버 지도에서 길찾기 →

  <h2>메뉴</h2>

  </div>

</div>
