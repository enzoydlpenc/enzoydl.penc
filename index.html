<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIM과업 일정표 관리</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --blue-dark:#1f4e79; --blue:#2e6da4; --blue-head:#2f75b5;
    --blue-light:#dbe9f4; --blue-cell:#d6e6f4; --yellow:#fdf3cf;
    --line:#7f9db9; --line-soft:#c8d4e0; --gray:#f2f5f8;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"맑은 고딕","Malgun Gothic",system-ui,sans-serif;
    background:#eef2f6;color:#1b2733;font-size:13px;}
  header.app{background:var(--blue-dark);color:#fff;padding:12px 20px;
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:30;}
  header.app h1{font-size:17px;margin:0;font-weight:700;}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;}
  .btn{background:#fff;color:var(--blue-dark);border:none;border-radius:6px;
    padding:8px 14px;font-size:12.5px;font-weight:600;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;transition:.15s;}
  .btn:hover{background:var(--blue-light);}
  .btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);}
  .btn.ghost:hover{background:rgba(255,255,255,.12);}
  .wrap{padding:16px;overflow:auto;position:relative;}
  table.sched{border-collapse:collapse;background:#fff;
    table-layout:fixed;box-shadow:0 1px 4px rgba(0,0,0,.08);}
  table.sched th,table.sched td{border:1px solid var(--line);padding:4px 6px;
    text-align:center;vertical-align:middle;word-break:break-word;}
  /* 엑셀식 크기 조절 핸들 */
  .col-resizer{position:absolute;top:0;right:-4px;width:8px;height:100%;
    cursor:col-resize;z-index:8;}
  .col-resizer:hover,.col-resizer.drag{background:rgba(46,109,164,.45);}
  .row-resizer{position:absolute;left:0;bottom:-4px;width:100%;height:8px;
    cursor:row-resize;z-index:8;}
  .row-resizer:hover,.row-resizer.drag{background:rgba(46,109,164,.45);}
  .title-row td{background:var(--blue-dark);color:#fff;font-size:18px;font-weight:700;
    padding:10px;letter-spacing:1px;}
  .title-row .total-label{background:var(--blue);font-size:13px;}
  .title-row .total-num{background:#cfe0f0;color:var(--blue-dark);font-size:16px;}
  thead.head th{background:var(--blue-head);color:#fff;font-weight:700;font-size:12.5px;
    position:sticky;top:0;}
  thead.head .sub th{font-size:12px;}
  td.cat{background:#efefef;font-weight:700;white-space:pre-line;font-size:12px;color:#333;position:relative;}
  td.subcat{background:var(--yellow);font-weight:600;white-space:pre-line;font-size:12px;}
  td.taskname{background:var(--yellow);text-align:left;padding-left:10px;font-weight:600;
    white-space:pre-line;font-size:12px;}
  td.attach{background:#fff;cursor:pointer;font-size:11.5px;}
  td.attach:hover{background:var(--blue-light);}
  .attach-add{display:inline-flex;align-items:center;gap:3px;color:#9aa7b3;
    border:1px dashed var(--line-soft);border-radius:10px;padding:2px 9px;font-size:11px;}
  td.attach:hover .attach-add{color:var(--blue-dark);border-color:var(--blue);}
  td.editable{cursor:text;}
  td.editable:hover{box-shadow:inset 0 0 0 1px var(--line-soft);}
  td.editable:focus{outline:2px solid var(--blue);outline-offset:-2px;
    background:#fffdf0;box-shadow:none;}
  .hintbar{background:#eaf2fb;border:1px solid #cfe0f0;border-radius:8px;
    padding:8px 14px;margin-bottom:12px;font-size:12.5px;color:#2c3e50;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .hintbar b{color:var(--blue-dark);}
  td.no{background:#fff;font-weight:600;cursor:pointer;position:relative;}
  td.no:hover{background:var(--blue-light);}
  .rowhl-box{position:absolute;border:2.5px solid #e2231a;border-radius:2px;
    pointer-events:none;z-index:20;box-sizing:border-box;display:none;}
  td.no .no-menu{display:block;font-size:11px;color:#9aa7b3;line-height:1;margin-top:2px;}
  td.no:hover .no-menu{color:var(--blue);}
  .rowmenu{position:fixed;z-index:70;background:#fff;border:1px solid var(--line);
    border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.22);padding:4px;display:none;min-width:150px;}
  .rowmenu.on{display:block;}
  .rowmenu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
    background:none;border:none;padding:8px 12px;font-size:12.5px;color:#1b2733;cursor:pointer;
    border-radius:6px;font-family:inherit;}
  .rowmenu button:hover{background:var(--blue-light);}
  .rowmenu button.danger{color:#c0392b;}
  .rowmenu button.danger:hover{background:#fdecea;}
  .rowmenu .sep{height:1px;background:var(--line-soft);margin:4px 6px;}
  .colormenu{position:fixed;z-index:70;background:#fff;border:1px solid var(--line);
    border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.22);padding:10px;display:none;width:186px;}
  .colormenu.on{display:block;}
  .colormenu .cm-title{font-size:11.5px;color:#6d7480;margin-bottom:7px;font-weight:600;}
  .swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:8px;}
  .swatch{width:22px;height:22px;border-radius:5px;border:1px solid rgba(0,0,0,.15);cursor:pointer;}
  .swatch:hover{transform:scale(1.12);box-shadow:0 0 0 2px var(--blue);}
  .cm-row{display:flex;align-items:center;gap:8px;}
  .cm-row label{font-size:11.5px;color:#4a5a6a;display:flex;align-items:center;gap:5px;cursor:pointer;}
  .cm-clear{margin-left:auto;background:none;border:1px solid var(--line-soft);border-radius:6px;
    padding:4px 9px;font-size:11.5px;color:#c0392b;cursor:pointer;font-family:inherit;}
  .cm-clear:hover{background:#fdecea;}
  .cm-sep{height:1px;background:var(--line-soft);margin:8px 2px;}
  .cm-act{display:block;width:100%;text-align:left;background:none;border:none;border-radius:6px;
    padding:7px 10px;font-size:12.5px;color:#1b2733;cursor:pointer;font-family:inherit;}
  .cm-act:hover{background:var(--blue-light);}
  .cm-act.danger{color:#c0392b;} .cm-act.danger:hover{background:#fdecea;}
  td.month.merged{background:var(--blue-cell);font-weight:600;}
  td.gubun{background:var(--gray);font-size:11.5px;font-weight:600;color:#5a6b7a;}
  td.month{font-size:11.5px;}
  td.month.plan{background:#eef5fb;}
  td.month.filled{background:var(--blue-cell);}
  td.month.black{background:#111;}
  td.person,td.period{background:#fff;font-size:11.5px;}
  td.note{background:#fff;text-align:left;padding-left:8px;font-size:11.5px;color:#4a5a6a;}
  .attach-chip{display:inline-flex;align-items:center;gap:3px;background:var(--blue);
    color:#fff;border-radius:10px;padding:1px 8px;font-size:10.5px;margin-left:6px;
    vertical-align:middle;cursor:pointer;}
  .attach-chip:hover{background:var(--blue-dark);}
  .row-plan td.gubun{border-bottom:1px dotted var(--line-soft);}
  .empty-note{color:#9aa7b3;font-style:italic;}
  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(20,30,40,.55);display:none;
    align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal-bg.on{display:flex;}
  .modal{background:#fff;border-radius:12px;max-width:920px;width:100%;max-height:88vh;
    display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.3);}
  .modal h3{margin:0;padding:14px 18px;background:var(--blue-dark);color:#fff;font-size:15px;
    display:flex;align-items:center;gap:10px;}
  .modal h3 .x{margin-left:auto;cursor:pointer;font-size:20px;line-height:1;opacity:.85;}
  .modal h3 .x:hover{opacity:1;}
  .modal-body{padding:16px 18px;overflow:auto;}
  .file-list{list-style:none;margin:0 0 12px;padding:0;}
  .file-list li{display:flex;align-items:center;gap:10px;padding:9px 12px;
    border:1px solid var(--line-soft);border-radius:8px;margin-bottom:8px;background:#fafcfe;}
  .file-list .fname{font-weight:600;flex:1;text-align:left;word-break:break-all;cursor:pointer;color:var(--blue-dark);}
  .file-list .fname:hover{text-decoration:underline;}
  .file-list .fsize{color:#8b98a5;font-size:11px;}
  .file-list .del{color:#c0392b;cursor:pointer;font-size:12px;border:none;background:none;}
  .drop{border:2px dashed var(--line);border-radius:10px;padding:22px;text-align:center;
    color:#5a6b7a;background:var(--gray);cursor:pointer;transition:.15s;}
  .drop.over{background:var(--blue-light);border-color:var(--blue);}
  .preview{margin-top:12px;border:1px solid var(--line-soft);border-radius:8px;overflow:hidden;}
  .preview img{max-width:100%;display:block;margin:0 auto;}
  .preview iframe{width:100%;height:60vh;border:none;}
  .hint{font-size:11.5px;color:#6b7885;margin-top:6px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--blue-dark);color:#fff;padding:10px 20px;border-radius:8px;
    font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:60;}
  .toast.on{opacity:1;}
  input[type=file]{display:none;}
</style>
</head>
<body>
<header class="app">
  <h1>📋 BIM과업 일정표 관리</h1>
  <div class="toolbar">
    <button class="btn" onclick="addTaskEnd()">➕ 과업 추가</button>
    <button class="btn ghost" onclick="undo()" title="실행취소 (Ctrl+Z)">↩ 실행취소</button>
    <button class="btn ghost" onclick="redo()" title="다시실행 (Ctrl+Y)">↪ 다시실행</button>
    <button class="btn ghost" onclick="exportPDF()">🖨 PDF 내보내기</button>
  </div>
</header>

<div class="wrap">
  <div class="hintbar">
    ✏️ <b>셀 클릭</b>=수정 · <b>Ctrl+V</b>=엑셀 범위 붙여넣기 · <b>Ctrl+Z/Ctrl+Y</b>=실행취소/다시실행 · <b>셀 우클릭</b>=배경색/셀 병합·해제 · <b>No칸 클릭</b>=과업 추가/삭제/이동 · <b>열/행 경계 드래그</b>=너비/높이(더블클릭=기본값) · (자동 저장)
  </div>
  <table class="sched">
    <colgroup>
      <col style="width:32px"><col style="width:52px"><col style="width:66px">
      <col style="width:132px"><col style="width:38px"><col style="width:38px">
      <col style="width:86px"><col style="width:42px">
      <col style="width:150px"><col style="width:150px"><col style="width:150px">
      <col style="width:150px"><col style="width:150px">
      <col style="width:120px"><col style="width:74px">
    </colgroup>
    <thead class="head"></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<!-- Attachment modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3><span id="modalTitle">첨부파일</span><span class="x" onclick="closeModal()">×</span></h3>
    <div class="modal-body">
      <ul class="file-list" id="fileList"></ul>
      <div class="drop" id="dropZone">
        📎 파일을 여기로 끌어놓거나 클릭해서 첨부하세요<br>
        <span class="hint">PDF·이미지는 아래에서 바로 미리보기, 그 외 파일은 클릭 시 열림 · 파일은 브라우저에 저장됩니다</span>
      </div>
      <input type="file" id="attachInput" multiple>
      <div class="preview" id="preview" style="display:none"></div>
    </div>
  </div>
</div>

<div class="rowmenu" id="rowMenu"></div>
<div class="colormenu" id="colorMenu"></div>
<div class="toast" id="toast"></div>

<script>
const els = {
  attachInput: document.getElementById('attachInput'),
  tbody: document.getElementById('tbody'),
  modalBg: document.getElementById('modalBg'),
  modalTitle: document.getElementById('modalTitle'),
  fileList: document.getElementById('fileList'),
  dropZone: document.getElementById('dropZone'),
  preview: document.getElementById('preview'),
  toast: document.getElementById('toast'),
};
const MONTHS = ['8월','9월','10월','11월','12월'];
const LS_KEY = 'bim_sched_v1';
// 붙여넣기/편집용 시각 열 좌표 (No·구분(계획/실적)·첨부 제외)
const COL={cat:0,subcat:1,name:2,leader:3,member:4,period:5,m0:6,note:11};
let coordMap={};   // "행_열" → 셀 매핑 (render마다 재구성)

// 엑셀식 열 너비 / 행 높이 (사용자 조절, 저장)
const DEFAULT_COLW=[32,52,66,132,38,38,86,42,150,150,150,150,150,120,74];
let colW=loadColW();     // 15개 열 픽셀 너비
let taskH=loadTaskH();   // { 과업index: 픽셀높이 }
function loadColW(){ try{const s=localStorage.getItem('bim_colw');if(s){const a=JSON.parse(s);
  if(Array.isArray(a)&&a.length===15)return a.map(n=>Math.max(24,+n||24));}}catch(e){} return DEFAULT_COLW.slice(); }
function loadTaskH(){ try{const s=localStorage.getItem('bim_rowh');if(s){const o=JSON.parse(s);
  if(o&&typeof o==='object')return o;}}catch(e){} return {}; }
function saveColW(){ try{localStorage.setItem('bim_colw',JSON.stringify(colW));}catch(e){} commitHistory(); }
function saveTaskH(){ try{localStorage.setItem('bim_rowh',JSON.stringify(taskH));}catch(e){} commitHistory(); }

/* ---------- 셀 병합/나누기 (본문 전 컬럼) ----------
   본문 병합 좌표계: 행 r(0..2N-1), 열 c
   0 대분류 · 1 중분류 · 2 과업명 · 3 리더 · 4 팀원 · 5 기간 · 6~10 8~12월 · 11 비고
   물리 표에서 c0~c5(구분~기간)와 c6~c11(진행률~비고) 사이에는 계획/실적 라벨열이 있어
   두 그룹을 가로질러 병합할 수 없다. */
const NCOL=12;
let mergeMap=loadMerges();      // 사용자 병합: key '행_열' → {rs,cs}
let userSplit=loadSplit();      // 사용자 분할: key '행_열' → true (기본 병합 해제)
function loadMerges(){ try{const s=localStorage.getItem('bim_merge');if(s){const o=JSON.parse(s);
  if(o&&typeof o==='object')return o;}}catch(e){} return {}; }
function loadSplit(){ try{const s=localStorage.getItem('bim_split');if(s){const o=JSON.parse(s);
  if(o&&typeof o==='object')return o;}}catch(e){} return {}; }
function saveMerges(){ try{localStorage.setItem('bim_merge',JSON.stringify(mergeMap));}catch(e){} commitHistory(); }
function saveSplit(){ try{localStorage.setItem('bim_split',JSON.stringify(userSplit));}catch(e){} commitHistory(); }
// 구조적 기본 span (계획/실적 통합, 대·중분류 그룹 병합)
function defaultSpans(){
  const N=DATA.length, def={};
  const catSpan=computeSpan(DATA.map(d=>d.cat));
  const subSpan=computeSpanWithin(DATA);
  for(let i=0;i<N;i++){
    const r=2*i, hasSub=DATA[i].subcat && DATA[i].subcat.trim()!=='';
    if(catSpan.start[i]) def[r+'_0']={rs:catSpan.len[i]*2,cs:1};
    if(hasSub){
      if(subSpan.start[i]) def[r+'_1']={rs:subSpan.len[i]*2,cs:1};
      def[r+'_2']={rs:2,cs:1};                        // 과업명
    }else{
      def[r+'_1']={rs:2,cs:2,as:'name'};              // 중분류 없으면 과업명이 두 칸(중분류+과업명)
    }
    def[r+'_3']={rs:2,cs:1};
    def[r+'_4']={rs:2,cs:1};
    def[r+'_5']={rs:2,cs:1};
    def[r+'_11']={rs:2,cs:1};
  }
  return def;
}
// 최종 레이아웃: 기본 span − 사용자 분할 + 사용자 병합
function buildLayout(){
  const R=2*DATA.length;
  const def=defaultSpans();
  for(const k in userSplit){ delete def[k]; }
  const anchor=Object.assign({}, def);
  for(const k in mergeMap){ anchor[k]=mergeMap[k]; }
  const covered={};
  for(const k in anchor){
    const [r,c]=k.split('_').map(Number);
    const cur=anchor[k];
    let rs=Math.min(cur.rs,R-r), cs=Math.min(cur.cs,NCOL-c);
    if(rs<1)rs=1; if(cs<1)cs=1; anchor[k]={rs,cs,as:cur.as};
    for(let a=0;a<rs;a++)for(let b=0;b<cs;b++){ if(a||b) covered[(r+a)+'_'+(c+b)]=true; }
  }
  return {anchor,covered,R};
}
function anchorCovering(L,r,c){
  const k=r+'_'+c;
  if(!L.covered[k]) return k;   // 자기 자신이 anchor (또는 1x1)
  for(const ak in L.anchor){ const [ar,ac]=ak.split('_').map(Number); const {rs,cs}=L.anchor[ak];
    if(r>=ar&&r<ar+rs&&c>=ac&&c<ac+cs) return ak; }
  return k;
}
// 구조 변경 시 병합/분할 좌표 재매핑
function remapMap(obj,fn){ const out={}; for(const k in obj){ const p=k.split('_'); const nr=fn(+p[0]);
  if(nr==null)continue; out[nr+'_'+p[1]]=obj[k]; } return out; }
function shiftMergesInsert(at){ const b=2*at;
  mergeMap=remapMap(mergeMap,r=>r>=b?r+2:r); userSplit=remapMap(userSplit,r=>r>=b?r+2:r);
  saveMerges(); saveSplit(); }
function shiftMergesDelete(i){ const a=2*i;
  const f=r=>(r===a||r===a+1)?null:(r>a+1?r-2:r);
  mergeMap=remapMap(mergeMap,f); userSplit=remapMap(userSplit,f); saveMerges(); saveSplit(); }
function swapMergesMove(i,j){
  const f=r=>{ if(r===2*i)return 2*j; if(r===2*i+1)return 2*j+1;
    if(r===2*j)return 2*i; if(r===2*j+1)return 2*i+1; return r; };
  mergeMap=remapMap(mergeMap,f); userSplit=remapMap(userSplit,f); saveMerges(); saveSplit(); }
function applyColWidths(){
  const cols=document.querySelectorAll('table.sched > colgroup > col');
  let sum=0;
  cols.forEach((c,i)=>{ c.style.width=colW[i]+'px'; sum+=colW[i]; });
  const t=document.querySelector('table.sched'); if(t) t.style.width=sum+'px';
  if(typeof applyHighlight==='function') applyHighlight();
}

/* ---------- 기본 데이터 (첨부 이미지 기준) ---------- */
function defaultData(){
  const b=(cat,subcat,name,leader,member,period,plan,actual,note)=>(
    {cat,subcat,name,leader,member,period,plan,actual,note,colors:{}});
  const E=['','','','',''];
  return [
    b('BIM운영체계\n구축','','상품별 주요공종 자재코드 표준화\n(3건: 배관/전기/계측제어)','홍길동','고길동',"'26.8.1~'26.12.31",
      ['10% (설계)','30% (○○)','50% (○○)','80% (○○)','100% (○)'],
      ['10% (설계)','30% (○○)','50% (○○)','80% (○○)','100% (○)'],
      '2개월 연장 예정 (현장 인증시점 지연)'),
    b('BIM운영체계\n구축','','BIM 통합운영 시스템 구축(CDE)','','','',
      ['10% (설계)','50% (○○)','100% (○○)','',''],
      ['20% (○○)','40% (○○)','90% (○○)','100% (○○)',''],
      '과업내용 변경'),
    b('BIM운영체계\n구축','BIM운영기반','Smart장비 연계 Reverse Eng. 역량 강화','','','',E.slice(),E.slice(),''),

let DATA = loadData();

function loadData(){
  try{
    const s=localStorage.getItem(LS_KEY);
    if(s){ const norm=normalizeData(JSON.parse(s)); if(norm) return norm; }
  }catch(e){ console.warn('저장된 데이터 불러오기 실패 → 기본값 사용',e); }
  return defaultData();
}
// 손상·구버전 데이터가 있어도 표가 비지 않도록 형식을 강제 정규화
function normalizeData(arr){
  if(!Array.isArray(arr)||arr.length===0) return null;
  const fix5=v=>{ const a=Array.isArray(v)?v.slice(0,5):[]; while(a.length<5)a.push('');
    return a.map(x=>x==null?'':String(x)); };
  return arr.map(d=>({
    cat:String((d&&d.cat)||''), subcat:String((d&&d.subcat)||''),
    name:String((d&&d.name)||''), leader:String((d&&d.leader)||''),
    member:String((d&&d.member)||''), period:String((d&&d.period)||''),
    plan:fix5(d&&d.plan), actual:fix5(d&&d.actual), note:String((d&&d.note)||''),
    colors:(d&&d.colors&&typeof d.colors==='object')?d.colors:{}
  }));
}
function saveData(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(DATA)); }catch(e){ console.warn('저장 실패',e); } commitHistory(); }

/* ---------- 실행취소(Ctrl+Z) / 다시실행(Ctrl+Y) ---------- */
let _past=[], _future=[], _lastCommit=null, _histLock=false, _histTimer=null;
function snapshotState(){ return JSON.stringify({D:DATA,M:mergeMap,S:userSplit,H:taskH,W:colW}); }
function doCommit(){ const s=snapshotState(); if(s===_lastCommit) return;
  if(_lastCommit!=null){ _past.push(_lastCommit); if(_past.length>200)_past.shift(); }
  _lastCommit=s; _future.length=0; }
function commitHistory(){ if(_histLock) return; clearTimeout(_histTimer); _histTimer=setTimeout(()=>{_histTimer=null;doCommit();},0); }
function flushHistory(){ if(_histTimer){ clearTimeout(_histTimer); _histTimer=null; doCommit(); } }
function restoreState(s){ const o=JSON.parse(s);
  DATA=o.D; mergeMap=o.M||{}; userSplit=o.S||{}; taskH=o.H||{}; if(o.W&&o.W.length===15)colW=o.W;
  _histLock=true; saveData(); saveMerges(); saveSplit(); saveTaskH(); saveColW(); _histLock=false;
  if(selectedTask!=null && selectedTask>=DATA.length) selectedTask=null;
  render();
}
function undo(){ flushHistory(); if(!_past.length){ toast('되돌릴 작업이 없습니다'); return; }
  _future.push(_lastCommit); const s=_past.pop(); _lastCommit=s; restoreState(s); toast('실행취소'); }
function redo(){ flushHistory(); if(!_future.length){ toast('다시 실행할 작업이 없습니다'); return; }
  _past.push(_lastCommit); const s=_future.pop(); _lastCommit=s; restoreState(s); toast('다시실행'); }
document.addEventListener('keydown',e=>{
  if(!(e.ctrlKey||e.metaKey)) return;
  const k=e.key.toLowerCase();
  if(k==='z' && !e.shiftKey){ e.preventDefault(); const a=document.activeElement; if(a&&a.blur)a.blur(); undo(); }
  else if(k==='y' || (k==='z'&&e.shiftKey)){ e.preventDefault(); const a=document.activeElement; if(a&&a.blur)a.blur(); redo(); }
});

const CLS=['cat','subcat','taskname','person','person','period','month','month','month','month','month','note'];
const FIELD=['cat','subcat','name','leader','member','period','plan','plan','plan','plan','plan','note'];
function makeBodyCell(r,c,span){
  const task=Math.floor(r/2), rowType=r%2, m=c-6;
  const td=document.createElement('td');
  // span.as: 특정 필드로 강제(중분류 없는 과업명이 c1 자리를 차지하는 경우)
  const asName=span&&span.as==='name';
  let field, val, cls, mCol=c;
  if(asName){ field='name'; val=DATA[task].name; cls='taskname'; mCol=2; }
  else if(c>=6&&c<=10){ field=rowType?'actual':'plan'; val=DATA[task][field][m]; cls='month'; }
  else { field=FIELD[c]; val=DATA[task][field]; cls=CLS[c]; }
  td.className=cls;
  if(cls==='month'){ if(val&&val.trim()!=='') td.classList.add(rowType?'filled':'plan'); }
  td.textContent=val||'';
  if(span&&(span.rs>1||span.cs>1)){ td.rowSpan=span.rs; td.colSpan=span.cs; td.classList.add('umerged'); }
  mkEditable(td,task,field,(c>=6&&c<=10)?m:null,r,mCol);
  if(c===0) addColResizer(td,1);
  return td;
}

function computeSpan(arr){
  const len=new Array(arr.length).fill(0);
  const start=new Array(arr.length).fill(false);
  let i=0;
  while(i<arr.length){
    let j=i;while(j+1<arr.length && arr[j+1]===arr[i])j++;
    start[i]=true;len[i]=j-i+1;i=j+1;
  }
  return {start,len};
}
// subcat: 같은 cat 그룹 안에서만 연속 병합
function computeSpanWithin(data){
  const len=new Array(data.length).fill(0);
  const start=new Array(data.length).fill(false);
  let i=0;
  while(i<data.length){
    const key=data[i].cat+'|'+data[i].subcat;
    let j=i;
    while(j+1<data.length && (data[j+1].cat+'|'+data[j+1].subcat)===key)j++;
    start[i]=true;len[i]=j-i+1;i=j+1;
  }
  return {start,len};
}

function escapeHtml(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function attachCellHtml(i){

/* ---------- PDF 내보내기 (화면에 보이는 표 그대로) ---------- */
async function exportPDF(){
  const table=document.querySelector('table.sched');
  if(!table){ toast('내보낼 표가 없습니다'); return; }
  if(typeof html2canvas==='undefined' || !window.jspdf){ toast('PDF 라이브러리 로딩 중입니다. 잠시 후 다시 시도하세요'); return; }
  const box=hlBox(); const prev=box.style.display; box.style.display='none';  // 선택 하이라이트는 제외
  toast('PDF 생성 중...');
  try{
    const canvas=await html2canvas(table,{scale:2,backgroundColor:'#ffffff',windowWidth:table.scrollWidth});
    const img=canvas.toDataURL('image/png');
    const { jsPDF }=window.jspdf;
    const pdf=new jsPDF('l','pt','a4');
    const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight();
    const margin=18;
    const imgW=pw-margin*2;
    const imgH=canvas.height*imgW/canvas.width;
    let heightLeft=imgH, pos=margin;
    pdf.addImage(img,'PNG',margin,pos,imgW,imgH);
    heightLeft-=(ph-margin*2);
    while(heightLeft>0){
      pos=margin-(imgH-heightLeft);
      pdf.addPage();
      pdf.addImage(img,'PNG',margin,pos,imgW,imgH);
      heightLeft-=(ph-margin*2);
    }
    pdf.save('BIM과업_일정표.pdf');
    toast('PDF를 내려받았습니다');
  }catch(err){ console.error(err); toast('PDF 생성 실패: '+err.message); }
  finally{ box.style.display=prev; }
}

let db, attachIndex={}, currentTask=-1;
function taskKey(i){ return DATA[i] ? (DATA[i].cat+'|'+DATA[i].subcat+'|'+DATA[i].name) : ('idx'+i); }

function openDB(){
  return new Promise((res,rej)=>{
    const rq=indexedDB.open('bim_files',1);
    rq.onupgradeneeded=e=>{const d=e.target.result;
      if(!d.objectStoreNames.contains('files'))
        d.createObjectStore('files',{keyPath:'id',autoIncrement:true});};
    rq.onsuccess=e=>{db=e.target.result;res();};
    rq.onerror=e=>rej(e);
  });
}
function refreshIndex(){
  return new Promise(res=>{
    attachIndex={};
    if(!db){res();return;}
    const tx=db.transaction('files','readonly').objectStore('files').getAll();
    tx.onsuccess=()=>{
      tx.result.forEach(f=>{(attachIndex[f.taskIdx]=attachIndex[f.taskIdx]||[]).push(f);});
      res();
    };
  });
}
async function openAttach(i){
  currentTask=i;
  els.modalTitle.textContent='📎 '+DATA[i].name.replace(/\n/g,' ');
  els.preview.style.display='none';els.preview.innerHTML='';
  await refreshIndex();

    els.fileList.innerHTML='<li style="color:#9aa7b3;justify-content:center">첨부된 파일이 없습니다</li>';

  }
  files.forEach(f=>{
    const li=document.createElement('li');
    li.innerHTML=`<span>${fileIcon(f.type)}</span>
      <span class="fname">${escapeHtml(f.name)}</span>
      <span class="fsize">${fmtSize(f.size)}</span>
      <button class="del" title="삭제">🗑</button>`;
    li.querySelector('.fname').onclick=()=>previewFile(f);
    li.querySelector('.del').onclick=()=>deleteFile(f.id);
    els.fileList.appendChild(li);
  });
}
function keyOf(i){ return taskKey(i); }
function fileIcon(t){
  if(/image/.test(t))return '🖼';
  if(/pdf/.test(t))return '📄';
  if(/sheet|excel|csv/.test(t))return '📊';
  if(/word|document/.test(t))return '📝';
  return '📎';
}
function fmtSize(n){return n<1024?n+'B':n<1048576?(n/1024).toFixed(1)+'KB':(n/1048576).toFixed(1)+'MB';}

function previewFile(f){
  const url=URL.createObjectURL(f.blob);
  if(/image/.test(f.type)){
    els.preview.innerHTML=`<img src="${url}">`;els.preview.style.display='block';
  }else if(/pdf/.test(f.type)){
    els.preview.innerHTML=`<iframe src="${url}"></iframe>`;els.preview.style.display='block';
  }else{
    // 그 외: 새 탭 다운로드/열기
    const a=document.createElement('a');a.href=url;a.download=f.name;
    a.target='_blank';document.body.appendChild(a);a.click();a.remove();
    els.preview.style.display='none';
    toast('파일을 새 탭에서 엽니다');
  }
}
function addFiles(fileList){
  const key=keyOf(currentTask);
  const tx=db.transaction('files','readwrite');const store=tx.objectStore('files');
  [...fileList].forEach(file=>{
    store.add({taskIdx:key,name:file.name,type:file.type,size:file.size,blob:file});
  });
  tx.oncomplete=async()=>{await refreshIndex();renderFileList();render();
    toast(fileList.length+'개 파일을 첨부했습니다');};
}
function deleteFile(id){
  const tx=db.transaction('files','readwrite');
  tx.objectStore('files').delete(id);
  tx.oncomplete=async()=>{await refreshIndex();renderFileList();render();};
}
els.attachInput.addEventListener('change',e=>{if(e.target.files.length)addFiles(e.target.files);e.target.value='';});
els.dropZone.addEventListener('click',()=>els.attachInput.click());
els.dropZone.addEventListener('dragover',e=>{e.preventDefault();els.dropZone.classList.add('over');});
els.dropZone.addEventListener('dragleave',()=>els.dropZone.classList.remove('over'));
els.dropZone.addEventListener('drop',e=>{e.preventDefault();els.dropZone.classList.remove('over');
  if(e.dataTransfer.files.length)addFiles(e.dataTransfer.files);});

function closeModal(){els.modalBg.classList.remove('on');}
els.modalBg.addEventListener('click',e=>{if(e.target===els.modalBg)closeModal();});

/* ---------- toast ---------- */
let toastT;
function toast(msg){els.toast.textContent=msg;els.toast.classList.add('on');
  clearTimeout(toastT);toastT=setTimeout(()=>els.toast.classList.remove('on'),2200);}

/* ---------- 인라인 편집 & 붙여넣기 ---------- */
let suppressFocusout=false;   // 붙여넣기/재렌더 중 편집종료 처리 억제
function reRender(){ suppressFocusout=true; try{ render(); } finally { suppressFocusout=false; } }
function setCellValue(td,val){
  const f=td.dataset.field, t=+td.dataset.task;
  val=(val==null?'':String(val)).replace(/\r/g,'').replace(/ /g,' ').trim();
  if(f==='plan'||f==='actual'){ DATA[t][f][+td.dataset.month]=val; }
  else { DATA[t][f]=val; }
  td.textContent=val;   // DOM 도 즉시 일치시켜 focusout 이 옛값으로 되돌리지 않게 함
}
// 편집 종료 시 데이터 반영
els.tbody.addEventListener('focusout',e=>{
  if(suppressFocusout) return;                 // 붙여넣기/재렌더로 인한 종료는 무시
  const td=e.target.closest && e.target.closest('td.editable'); if(!td)return;
  if(!document.contains(td))return;           // 이미 재렌더로 사라진 셀 무시
  setCellValue(td, td.textContent);
  saveData();
  const f=td.dataset.field;
  if(f==='cat'||f==='subcat'){ reRender(); }     // 병합 레이아웃 갱신
  else if(f==='plan'||f==='actual'){           // 진행률 셀 색상 갱신
    td.classList.remove('plan','filled');
    if(td.textContent.trim()!=='') td.classList.add(f==='plan'?'plan':'filled');
  }
});
// 엑셀 클립보드 파서: 탭=열, 줄바꿈=행, 단 "큰따옴표" 안의 줄바꿈/탭은 셀 내부 문자로 취급
function parseClipboard(text){
  text=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  const rows=[]; let row=[], field='', inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inQ){
      if(ch==='"'){
        if(text[i+1]==='"'){ field+='"'; i++; }   // "" → 따옴표 하나
        else inQ=false;
      } else field+=ch;
    }else{
      if(ch==='"' && field===''){ inQ=true; }       // 필드 시작의 따옴표만 인용 시작
      else if(ch==='\t'){ row.push(field); field=''; }
      else if(ch==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else field+=ch;
    }
  }
  row.push(field); rows.push(row);
  // 마지막에 개행으로 생긴 빈 행 제거
  if(rows.length>1 && rows[rows.length-1].length===1 && rows[rows.length-1][0]==='') rows.pop();
  return rows;
}
// 엑셀에서 복사한 범위 붙여넣기
els.tbody.addEventListener('paste',e=>{
  const td=e.target.closest && e.target.closest('td.editable'); if(!td)return;
  e.preventDefault();
  const text=((e.clipboardData||window.clipboardData)||{getData:()=>''}).getData('text');
  if(text==null) return;
  const grid=parseClipboard(text);
  const baseR=+td.dataset.r, baseC=+td.dataset.c;
  let applied=0;
  grid.forEach((cols,ri)=>cols.forEach((val,ci)=>{
    const tgt=coordMap[(baseR+ri)+'_'+(baseC+ci)];
    if(tgt){ setCellValue(tgt,val); applied++; }
  }));
  saveData(); reRender();
  toast(`붙여넣기 완료 · ${applied}개 셀 반영`);
});
// Enter 는 줄바꿈 대신 편집 종료
els.tbody.addEventListener('keydown',e=>{
  const td=e.target.closest && e.target.closest('td.editable'); if(!td)return;
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); td.blur(); }
});

/* ---------- 과업(행) 추가·삭제·이동 ---------- */
function newTask(ref){ // ref: 같은 그룹으로 넣기 위한 참조 과업(선택)
  return {cat:ref?ref.cat:'', subcat:ref?ref.subcat:'', name:'', leader:'', member:'',
    period:'', plan:['','','','',''], actual:['','','','',''], note:'', colors:{}};
}
function addTaskEnd(){
  DATA.push(newTask(DATA[DATA.length-1]));
  saveData(); render();
  toast('맨 아래에 과업을 추가했습니다');
  // 새 과업 위치로 스크롤
  const rows=els.tbody.querySelectorAll('tr.row-plan');
  const last=rows[rows.length-1];
  if(last && last.scrollIntoView) last.scrollIntoView({block:'center'});
}
function insertTask(i,where){
  const at = where==='above' ? i : i+1;
  DATA.splice(at,0,newTask(DATA[i]));   // 클릭한 과업과 같은 대/중분류로 생성
  shiftMergesInsert(at);
  saveData(); render();
  toast(where==='above'?'위에 과업을 추가했습니다':'아래에 과업을 추가했습니다');
}
function deleteTask(i){
  if(!confirm(`${i+1}번 과업을 삭제할까요?\n"${(DATA[i].name||'(이름 없음)')}"`))return;
  DATA.splice(i,1);
  shiftMergesDelete(i);
  if(DATA.length===0) DATA.push(newTask());
  saveData(); render();
  toast('과업을 삭제했습니다');
}
function moveTask(i,dir){
  const j=i+dir;
  if(j<0||j>=DATA.length)return;
  const t=DATA[i]; DATA[i]=DATA[j]; DATA[j]=t;
  swapMergesMove(i,j);
  saveData(); render();
}
// No 셀 메뉴
const rowMenu=document.getElementById('rowMenu');
function openRowMenu(i,ev){
  ev.stopPropagation();
  setSelectedTask(i);
  rowMenu.innerHTML=`
    <button onclick="insertTask(${i},'above');closeRowMenu()">⬆ 위에 과업 추가</button>
    <button onclick="insertTask(${i},'below');closeRowMenu()">⬇ 아래에 과업 추가</button>
    <div class="sep"></div>
    <button onclick="moveTask(${i},-1);closeRowMenu()">↑ 위로 이동</button>
    <button onclick="moveTask(${i},1);closeRowMenu()">↓ 아래로 이동</button>
    <div class="sep"></div>
    <button class="danger" onclick="deleteTask(${i});closeRowMenu()">🗑 이 과업 삭제</button>`;
  rowMenu.classList.add('on');
  // 위치 계산 (화면 밖으로 안 나가게)
  const mw=170, mh=230, pad=8;
  let x=ev.clientX, y=ev.clientY;
  if(x+mw+pad>innerWidth) x=innerWidth-mw-pad;
  if(y+mh+pad>innerHeight) y=Math.max(pad,innerHeight-mh-pad);
  rowMenu.style.left=x+'px'; rowMenu.style.top=y+'px';
}
function closeRowMenu(){ rowMenu.classList.remove('on'); }
document.addEventListener('click',e=>{ if(!rowMenu.contains(e.target)) closeRowMenu(); });
window.addEventListener('scroll',closeRowMenu,true);

/* ---------- 셀 배경색 편집 (우클릭) ---------- */
const COLOR_PRESETS=['#d6e6f4','#eef5fb','#fdf3cf','#efefef','#d8f0d8','#ffe0e0',
  '#ffe9c7','#e2d8f2','#cfe0f0','#c7ead0','#ffd9b3','#ffffff'];
const colorMenu=document.getElementById('colorMenu');
let colorTarget=null; // {task, field, month}
function openColorMenu(td,ev){
  ev.preventDefault(); ev.stopPropagation();
  colorTarget={task:+td.dataset.task, field:td.dataset.field,
    month:td.dataset.month!=null?+td.dataset.month:null,
    r:+td.dataset.r, c:+td.dataset.c};
  const L=buildLayout();
  const ak=anchorCovering(L,colorTarget.r,colorTarget.c);
  const sp=L.anchor[ak]||{rs:1,cs:1};
  const spanned=(sp.rs>1||sp.cs>1);
  const mergeHtml=`<div class="cm-sep"></div>`+
    `<button class="cm-act" onclick="mergeCells('right')">▶ 오른쪽 칸과 병합</button>`+
    `<button class="cm-act" onclick="mergeCells('down')">▼ 아래 칸과 병합</button>`+
    (spanned?`<button class="cm-act danger" onclick="splitCells()">✂ 셀 나누기</button>`:``);
  colorMenu.innerHTML=
    `<div class="cm-title">셀 배경색 선택</div>`+
    `<div class="swatches">`+
      COLOR_PRESETS.map(c=>`<div class="swatch" style="background:${c}" onclick="applyColor('${c}')"></div>`).join('')+
    `</div>`+
    `<div class="cm-row">`+
      `<label>🎨 직접 선택 <input type="color" onchange="applyColor(this.value)"></label>`+
      `<button class="cm-clear" onclick="clearColor()">지우기</button>`+
    `</div>`+
    mergeHtml;
  colorMenu.classList.add('on');
  const mw=200, mh=spanned?260:230, pad=8;
  let x=ev.clientX, y=ev.clientY;
  if(x+mw+pad>innerWidth) x=innerWidth-mw-pad;
  if(y+mh+pad>innerHeight) y=Math.max(pad,innerHeight-mh-pad);
  colorMenu.style.left=x+'px'; colorMenu.style.top=y+'px';
}
function applyColor(color){
  if(!colorTarget)return;
  const d=DATA[colorTarget.task]; if(!d)return;
  d.colors=d.colors||{};
  d.colors[colorKey(colorTarget.field,colorTarget.month)]=color;
  saveData(); render(); closeColorMenu();
}
function clearColor(){
  if(!colorTarget)return;
  const d=DATA[colorTarget.task]; if(!d||!d.colors)return;
  delete d.colors[colorKey(colorTarget.field,colorTarget.month)];
  saveData(); render(); closeColorMenu();
}
// ---- 셀 병합/해제 (본문 전 컬럼) ----
function sameGroup(c1,c2){ return (c1<=5)===(c2<=5); }  // 구분~기간 / 진행률~비고 그룹
function mergeCells(dir){
  if(!colorTarget)return;
  const L=buildLayout();
  const ak=anchorCovering(L,colorTarget.r,colorTarget.c);
  const [ar,ac]=ak.split('_').map(Number);
  const cur=L.anchor[ak]||{rs:1,cs:1};
  let rs=cur.rs, cs=cur.cs;
  if(dir==='right'){
    const nc=ac+cs;                       // 새로 흡수할 열
    if(nc>=NCOL || !sameGroup(ac,nc)){ toast('오른쪽으로 더 병합할 수 없습니다'); return; }
    cs+=1;
  }else{
    if(ar+rs>=L.R){ toast('아래로 더 병합할 수 없습니다'); return; }
    rs+=1;
  }
  // 새 사각형과 겹치는 다른 사용자 병합은 완전히 포함될 때만 흡수
  for(const mk in mergeMap){ if(mk===ak)continue;
    const [mr,mc]=mk.split('_').map(Number); const ms=mergeMap[mk];
    const overlap=(mr<ar+rs&&mr+ms.rs>ar&&mc<ac+cs&&mc+ms.cs>ac);
    if(overlap){
      if(mr>=ar&&mr+ms.rs<=ar+rs&&mc>=ac&&mc+ms.cs<=ac+cs) delete mergeMap[mk];
      else { toast('겹치는 병합이 있어 불가합니다'); return; }
    }
  }
  mergeMap[ak]={rs,cs};
  if(userSplit[ak]) delete userSplit[ak];
  saveMerges(); saveSplit(); reRender();
  toast('셀을 병합했습니다');
}
function splitCells(){
  if(!colorTarget)return;
  const L=buildLayout();
  const ak=anchorCovering(L,colorTarget.r,colorTarget.c);
  if(mergeMap[ak]){ delete mergeMap[ak]; }   // 사용자 병합 해제 → 기본으로 복귀
  else { userSplit[ak]=true; }               // 기본 병합(계획/실적 통합 등) 해제 → 낱칸
  saveMerges(); saveSplit(); reRender();
  toast('셀을 나눴습니다');
}
function closeColorMenu(){ colorMenu.classList.remove('on'); }
// 편집 셀 우클릭 → 색상 메뉴
els.tbody.addEventListener('contextmenu',e=>{
  const td=e.target.closest && e.target.closest('td.editable'); if(!td)return;
  openColorMenu(td,e);
});
document.addEventListener('click',e=>{ if(!colorMenu.contains(e.target)) closeColorMenu(); });
window.addEventListener('scroll',closeColorMenu,true);

/* ---------- 엑셀식 열 너비 / 행 높이 드래그 조절 ---------- */
let colDrag=null, rowDrag=null;
function addColResizer(host,colIdx){
  if(!host) return;
  const h=document.createElement('div');
  h.className='col-resizer'; h.contentEditable='false';
  h.title='드래그: 열 너비 조절 · 더블클릭: 기본값';
  h.addEventListener('mousedown',ev=>{
    ev.preventDefault(); ev.stopPropagation();
    colDrag={colIdx, startX:ev.clientX, startW:colW[colIdx], h};
    h.classList.add('drag');
    document.body.style.userSelect='none'; document.body.style.cursor='col-resize';
  });
  h.addEventListener('click',ev=>ev.stopPropagation());
  h.addEventListener('dblclick',ev=>{ ev.preventDefault(); ev.stopPropagation();
    colW[colIdx]=DEFAULT_COLW[colIdx]; applyColWidths(); saveColW(); });
  host.appendChild(h);
}
function addRowResizer(host,taskIdx){
  const h=document.createElement('div');
  h.className='row-resizer'; h.contentEditable='false';
  h.title='드래그: 행 높이 조절 · 더블클릭: 기본값';
  h.addEventListener('mousedown',ev=>{
    ev.preventDefault(); ev.stopPropagation();
    const cur=taskH[taskIdx]||host.offsetHeight||48;
    rowDrag={task:taskIdx, startY:ev.clientY, startH:cur, h};
    h.classList.add('drag');
    document.body.style.userSelect='none'; document.body.style.cursor='row-resize';
  });
  h.addEventListener('click',ev=>ev.stopPropagation());
  h.addEventListener('dblclick',ev=>{ ev.preventDefault(); ev.stopPropagation();
    delete taskH[taskIdx]; saveTaskH(); reRender(); });
  host.appendChild(h);
}
function applyRowHeight(taskIdx){
  const cell=document.querySelector(`td.no[data-task="${taskIdx}"]`);
  if(cell) cell.style.height=taskH[taskIdx]+'px';
  applyHighlight();
}
document.addEventListener('mousemove',ev=>{
  if(colDrag){
    const dx=ev.clientX-colDrag.startX;
    colW[colDrag.colIdx]=Math.max(24, Math.round(colDrag.startW+dx));
    applyColWidths();
  }else if(rowDrag){
    const dy=ev.clientY-rowDrag.startY;
    taskH[rowDrag.task]=Math.max(24, Math.round(rowDrag.startH+dy));
    applyRowHeight(rowDrag.task);
  }
});
document.addEventListener('mouseup',()=>{
  if(colDrag){ colDrag.h.classList.remove('drag'); colDrag=null; saveColW();
    document.body.style.userSelect=''; document.body.style.cursor=''; }
  if(rowDrag){ rowDrag.h.classList.remove('drag'); rowDrag=null; saveTaskH();
    document.body.style.userSelect=''; document.body.style.cursor=''; }
});

/* ---------- init ---------- */
(function(){
  // 표를 먼저 그린다 (IndexedDB 지연/차단과 무관하게 항상 표시)
  try{ render(); }
  catch(e){
    console.error('렌더 오류 → 기본값으로 복구',e);
    try{ localStorage.removeItem(LS_KEY); }catch(_){}
    DATA=defaultData();
    try{ render(); }catch(e2){ console.error('복구 렌더 실패',e2); }
  }
  _lastCommit=snapshotState();   // 실행취소 기준 상태
  // 첨부파일 저장소는 이후 초기화하고, 준비되면 첨부 건수만 다시 반영
  Promise.resolve()
    .then(openDB)
    .then(refreshIndex)
    .then(render)
    .catch(e=>console.warn('IndexedDB 사용 불가 (첨부 기능 제한)',e));
})();
